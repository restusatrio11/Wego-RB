                  <div className="flex justify-between">

    // ==========================================
    // FLOATING PROTOTYPE SWITCHER (Per prototype skill)
    // ==========================================
    function PrototypeSwitcher({ currentVariant, setVariant }) {
      const variants = [
        { key: 'A', name: 'Variant A: Pure Editorial Magazine (1:1 ilovecreatives)' },
        { key: 'B', name: 'Variant B: Live & Upcoming Spotlight' },
        { key: 'C', name: 'Variant C: Split-Curator Index' }
      ];

      const currentIndex = variants.findIndex(v => v.key === currentVariant);

      const goPrev = () => {
        const nextIdx = (currentIndex - 1 + variants.length) % variants.length;
        setVariant(variants[nextIdx].key);
      };

      const goNext = () => {
        const nextIdx = (currentIndex + 1) % variants.length;
        setVariant(variants[nextIdx].key);
      };

      return (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-black text-white px-5 py-3 rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.4)] border border-gray-700">
          <button 
            onClick={goPrev}
            className="w-8 h-8 rounded-full bg-neutral-800 hover:bg-neutral-700 flex items-center justify-center font-bold text-sm transition-colors"
            title="Varian Sebelumnya (Keyboard ←)"
          >
            ←
          </button>

          <div className="px-2 font-mono text-xs md:text-sm tracking-wide text-center min-w-[260px]">
            <span className="text-bps-yellow font-bold mr-2">[{variants[currentIndex].key}]</span>
            {variants[currentIndex].name}
          </div>

          <button 
            onClick={goNext}
            className="w-8 h-8 rounded-full bg-neutral-800 hover:bg-neutral-700 flex items-center justify-center font-bold text-sm transition-colors"
            title="Varian Berikutnya (Keyboard →)"
          >
            →
          </button>
        </div>
      );
    }

    // --- Main App Root ---
    function App() {
      const getInitialVariant = () => {
        const params = new URLSearchParams(window.location.search);
        return params.get('variant') || 'A';
      };

      const [variant, setVariant] = useState(getInitialVariant);

      const updateVariant = (newVar) => {
        setVariant(newVar);
        const url = new URL(window.location);
        url.searchParams.set('variant', newVar);
        window.history.replaceState({}, '', url);
      };

      // Keyboard arrow navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
          if (e.key === 'ArrowLeft') {
            const keys = ['A', 'B', 'C'];
            const idx = keys.indexOf(variant);
            updateVariant(keys[(idx - 1 + keys.length) % keys.length]);
          } else if (e.key === 'ArrowRight') {
            const keys = ['A', 'B', 'C'];
            const idx = keys.indexOf(variant);
            updateVariant(keys[(idx + 1) % keys.length]);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [variant]);

      return (
        <div>
          <Header />
          {variant === 'A' && <VariantA />}
          {variant === 'B' && <VariantB />}
          {variant === 'C' && <VariantC />}
          <PrototypeSwitcher currentVariant={variant} setVariant={updateVariant} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
