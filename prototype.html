        return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w${width}`;
      }
      return url;

                      src={convertDriveUrl(spk.avatarUrl)} 
                      alt={spk.name} 
                      className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-300"
                    />
                    <div className="absolute top-2 left-2 editorial-badge text-[10px] bg-white">
                      {spk.satker}
                    </div>
                  </div>

                  <h4 className="font-serif font-bold text-base leading-snug mb-1">{spk.name}</h4>
                  <p className="text-xs text-editorial-muted mb-3">{spk.role}</p>

                  <div className="flex flex-wrap gap-1 mb-4">
                    {spk.topics.map((t, idx) => (
                      <span key={idx} className="editorial-badge text-[9px] bg-editorial-card border-black/30">
                        {t}
                      </span>
                    ))}
                  </div>
                </div>

                <p className="text-xs italic font-serif text-gray-700 border-t border-black/10 pt-3 line-clamp-2">
                  "{spk.quote}"
                </p>
              </div>
            ))}
          </div>
        </section>
      );
    }

    // ==========================================
    // 6. COMPONENT: Seminar Archive (Filterable)
    // ==========================================
    function SeminarArchive({ seminars }) {
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const categories = [
        { key: 'ALL', label: 'Semua Kategori' },
        { key: 'Teknologi & Data Science', label: 'Teknologi & Data' },
        { key: 'Reformasi Birokrasi & ZI', label: 'RB & Zona Integritas' },
        { key: 'Visualisasi & Komunikasi', label: 'Visualisasi & Komunikasi' }
      ];

      const filteredSeminars = useMemo(() => {
        return seminars.filter(sem => {
          const matchCat = selectedCategory === 'ALL' || sem.category === selectedCategory;
          const matchSearch = sem.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              sem.speakerName.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [seminars, selectedCategory, searchQuery]);

      return (
        <section id="seminars" className="px-6 md:px-12 py-16 bg-[#F4EFE6] border-y border-black">
          <div className="max-w-7xl mx-auto">
            <div className="flex flex-col md:flex-row md:items-baseline justify-between mb-8 pb-4 border-b border-black">
              <div>
                <span className="font-mono text-xs uppercase tracking-wider text-editorial-muted">KNOWLEDGE REPOSITORY</span>
                <h2 className="font-serif text-3xl md:text-5xl font-normal mt-1">Arsip Sesi & Slide Materi ✦</h2>
              </div>
              <p className="text-sm font-mono text-editorial-muted mt-2 md:mt-0">
                Unduh paparan presentasi & rekaman video
              </p>
            </div>

            {/* Filter and Search Bar */}
            <div className="flex flex-col md:flex-row gap-4 justify-between items-center mb-8">
              <div className="flex flex-wrap gap-2 w-full md:w-auto">
                {categories.map(c => (
                  <button
                    key={c.key}
                    onClick={() => setSelectedCategory(c.key)}
                    className={`editorial-pill-btn text-xs ${selectedCategory === c.key ? 'editorial-pill-btn-dark' : 'bg-white'}`}
                  >
                    {c.label}
                  </button>
                ))}
              </div>

              <div className="w-full md:w-72">
                <input 
                  type="text" 
                  placeholder="Cari judul atau pemateri..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full border-2 border-black px-4 py-2 text-xs font-mono rounded-full bg-white focus:outline-none focus:ring-2 focus:ring-black"
                />
              </div>
            </div>

            {/* Grid of Seminar Cards */}
            {filteredSeminars.length === 0 ? (
              <div className="bg-white border-2 border-black p-12 text-center font-mono text-sm text-editorial-muted">
                Tidak ada sesi seminar yang cocok dengan pencarian "{searchQuery}".
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                {filteredSeminars.map(sem => (
                  <div 
                    key={sem.id} 
                    className="border-2 border-black bg-white p-5 editorial-card-shadow flex flex-col justify-between"
                  >
                    <div>
                      <div className="aspect-video bg-gray-100 border border-black mb-4 overflow-hidden relative">
                        <img 
                          src={convertDriveUrl(sem.flyerUrl)} 
                          alt={sem.title} 
                          className="w-full h-full object-cover hover:scale-105 transition-transform duration-300" 
                        />
                        <div className="absolute bottom-2 left-2 editorial-badge bg-white">
                          EPISODE #{sem.sessionNumber}
                        </div>
                      </div>

                      <div className="flex justify-between items-center mb-2">
                        <span className="editorial-badge bg-bps-pastelBlue text-bps-navy text-[10px]">
                          {sem.category}
                        </span>
                        <span className="font-mono text-[11px] text-editorial-muted">{sem.dateDisplay}</span>
                      </div>

                      <h3 className="font-serif text-xl font-bold leading-snug mb-2 line-clamp-2">
                        {sem.title}
                      </h3>

                      <p className="text-xs text-editorial-muted mb-4">
                        Pemateri: <span className="font-semibold text-black">{sem.speakerName}</span>
                      </p>

                      <p className="text-xs text-gray-700 line-clamp-2 mb-6">
                        {sem.description}
                      </p>
                    </div>

                    <div className="flex gap-2 pt-4 border-t border-black/10">
                      <a 
                        href={sem.recordingUrl} 
                        target="_blank" 
                        className="flex-1 text-center editorial-pill-btn text-xs py-2"
                      >
                        Rekaman 📺
                      </a>
                      <a 
                        href={sem.materialsUrl} 
                        target="_blank" 
                        className="flex-1 text-center editorial-pill-btn editorial-pill-btn-dark text-xs py-2"
                      >
                        Unduh Slide 💾
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </section>
      );
    }

    // ==========================================
    // 7. COMPONENT: Wego Wall Testimonials
    // ==========================================
    function WegoWall({ testimonials }) {
      return (
        <section id="testimoni" className="px-6 md:px-12 py-16 max-w-7xl mx-auto">
          <div className="border-b border-black pb-4 mb-8">
            <span className="font-mono text-xs uppercase tracking-wider text-editorial-muted">KATA REKAN BPS</span>
            <h2 className="font-serif text-3xl md:text-5xl font-normal mt-1">Wego Wall of Impact 💬</h2>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {testimonials.map((t, idx) => (
              <div 
                key={idx} 
                className="border-2 border-black bg-white p-6 editorial-card-shadow-sm flex flex-col justify-between"
              >
                <div className="font-serif text-3xl text-bps-orange leading-none mb-3">“</div>
                <p className="font-serif text-base text-editorial-text italic leading-relaxed mb-6">
                  {t.quote}
                </p>
                <div className="border-t border-black/10 pt-4 font-mono text-xs">
                  <div className="font-bold text-black">{t.name}</div>
                  <div className="text-editorial-muted">{t.role} • {t.satker}</div>
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    // ==========================================
    // 8. COMPONENT: Kotak Gagasan (Classifieds Style)
    // ==========================================
    function KotakGagasanSection({ onOpenGagasan }) {
      return (
        <section id="gagasan" className="px-6 md:px-12 py-16 max-w-7xl mx-auto">
          <div className="border-2 border-black p-8 md:p-12 bg-white editorial-card-shadow relative">
            <div className="absolute -top-3.5 left-8 bg-black text-white font-mono text-xs px-4 py-1 rounded-full uppercase tracking-wider">
              PARTISIPASI INSAN STATISTIK
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
              <div className="lg:col-span-7">
                <h3 className="font-serif text-3xl md:text-5xl font-normal leading-tight mb-4">
                  Punya inovasi atau keahlian praktis yang ingin dibagikan?
                </h3>
                <p className="text-editorial-muted text-base leading-relaxed mb-8">
                  Wego adalah panggung terbuka tanpa memandang jenjang kepangkatan. Cukup bawa satu solusi praktis yang bisa membantu rekan kerja lainnya mengatasi kesulitan operasional.
                </p>
                <div className="flex flex-wrap gap-4">
                  <button 
                    onClick={onOpenGagasan}
                    className="editorial-pill-btn editorial-pill-btn-dark text-sm px-6 py-3"
                  >
                    Daftar Jadi Pemateri Wego ✍️
                  </button>
                  <button 
                    onClick={onOpenGagasan}
                    className="editorial-pill-btn text-sm px-6 py-3"
                  >
                    Usulkan Topik Baru 💡
                  </button>
                </div>
              </div>

              {/* Classifieds Box */}
              <div className="lg:col-span-5 bg-editorial-card border border-black p-6 font-mono text-xs">
                <div className="flex justify-between items-center border-b border-black pb-3 mb-4">
                  <span className="font-bold uppercase tracking-wider">TOP REQUEST TOPIK BULAN INI:</span>
                  <span className="editorial-badge bg-white">POLLING</span>
                </div>
                <ul className="space-y-3">
                  <li className="flex justify-between items-center p-2 bg-white border border-black/10">
                    <span>1. Otomasi Rekapitulasi SBR Python</span>
                    <span className="font-bold text-bps-orange">19 Vote</span>
                  </li>
                  <li className="flex justify-between items-center p-2 bg-white border border-black/10">
                    <span>2. Bedah Indikator Sakernas & Susenas</span>
                    <span className="font-bold text-bps-orange">14 Vote</span>
                  </li>
                  <li className="flex justify-between items-center p-2 bg-white border border-black/10">
                    <span>3. Pembuatan Dashboard PowerBI Efisien</span>
                    <span className="font-bold text-bps-orange">11 Vote</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ==========================================
    // 9. COMPONENT: Modal Dialog (Kotak Gagasan)
    // ==========================================
    function GagasanModal({ isOpen, onClose, formUrl }) {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border-2 border-black max-w-lg w-full p-6 md:p-8 editorial-card-shadow relative">
            <button 
              onClick={onClose}
              className="absolute top-4 right-4 w-8 h-8 rounded-full border border-black flex items-center justify-center font-mono font-bold hover:bg-black hover:text-white transition-colors"
            >
              ✕
            </button>

            <div className="mb-4">
              <span className="editorial-badge bg-bps-pastelOrange text-bps-orange">KOTAK GAGASAN WEGO</span>
            </div>

            <h3 className="font-serif text-2xl md:text-3xl font-bold mb-3">
              Ajukan Diri atau Usulkan Topik Sesi
            </h3>

            <p className="text-editorial-muted text-sm leading-relaxed mb-6">
              Pengajuan ini terhubung langsung ke Google Form panitia Wego BPS Provinsi Sumatera Utara. Setiap usulan akan ditindaklanjuti untuk jadwal sesi berikutnya.
            </p>

            <div className="space-y-3 mb-6">
              <a 
                href={formUrl} 
                target="_blank" 
                className="block text-center w-full editorial-pill-btn editorial-pill-btn-dark py-3 text-sm"
              >
                Buka Google Form Pengajuan 🚀
              </a>
              <button 
                onClick={onClose}
                className="block text-center w-full editorial-pill-btn py-3 text-sm"
              >
                Tutup Jendela
              </button>
            </div>

            <div className="font-mono text-[11px] text-editorial-muted border-t border-black/10 pt-3 text-center">
              Tim Reformasi Birokrasi BPS Provinsi Sumatera Utara
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 10. COMPONENT: Global Footer
    // ==========================================
    function Footer({ settings }) {
      return (
        <footer className="border-t-2 border-black bg-[#121212] text-white py-12 px-6 md:px-12">
          <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-8">
            <div>
              <div className="font-serif text-3xl font-bold tracking-tight mb-2">
                wego<span className="text-bps-orange italic">.rb</span>
              </div>
              <p className="text-neutral-400 text-xs max-w-md font-sans">
                Wadah Edukasi & Gagasan Orang BPS — Program Inovasi Reformasi Birokrasi BPS Provinsi Sumatera Utara.
              </p>
            </div>

            <div className="flex flex-col md:flex-row gap-6 font-mono text-xs text-neutral-300">
              <a href="#upcoming" className="hover:text-white">Jadwal Sesi</a>
              <a href="#speakers" className="hover:text-white">Wegoers</a>
              <a href="#seminars" className="hover:text-white">Slide & Video</a>
              <a href="#gagasan" className="hover:text-white">Kotak Gagasan</a>
              <span>Kontak: {settings.contactEmail}</span>
            </div>
          </div>

          <div className="max-w-7xl mx-auto mt-8 pt-8 border-t border-neutral-800 flex justify-between font-mono text-[11px] text-neutral-500">
            <span>© 2026 BPS Provinsi Sumatera Utara. All rights reserved.</span>
            <span>Desain terinspirasi estetika editorial ilovecreatives.</span>
          </div>
        </footer>
      );
    }

    // ==========================================
    // MAIN APPLICATION ASSEMBLY (App)
    // ==========================================
    function App() {
      const [settings] = useState(initialSiteSettings);
      const [speakers] = useState(initialSpeakers);
      const [seminars] = useState(initialSeminars);
      const [testimonials] = useState(initialTestimonials);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const upcoming = seminars.find(s => s.status === 'UPCOMING') || seminars[0];

      return (
        <div className="min-h-screen flex flex-col bg-[#FBF8F3] text-editorial-text selection:bg-bps-pastelBlue selection:text-black">
          <Header onOpenGagasan={() => setIsModalOpen(true)} />
          <MarqueeTicker text={settings.runningTicker} />
          
          <main className="flex-1">
            <HeroSection settings={settings} onOpenGagasan={() => setIsModalOpen(true)} />
            <UpcomingSpotlight seminar={upcoming} />
            <SpeakersHallOfFame speakers={speakers} onSelectSpeaker={(spk) => alert(`Profil: ${spk.name} (${spk.satker})\n"${spk.quote}"`)} />
            <SeminarArchive seminars={seminars} />
            <WegoWall testimonials={testimonials} />
            <KotakGagasanSection onOpenGagasan={() => setIsModalOpen(true)} />
          </main>

          <Footer settings={settings} />

          <GagasanModal 
            isOpen={isModalOpen} 
            onClose={() => setIsModalOpen(false)} 
            formUrl={settings.kotakGagasanUrl} 
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
